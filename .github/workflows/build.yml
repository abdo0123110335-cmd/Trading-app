name: Build Android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build AAB (for Google Play)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project
        run: |
          PUBSPEC=$(find . -maxdepth 2 -name pubspec.yaml -not -path "*/node_modules/*" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found" && exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create . --platforms=android --org com.yourcompany --project-name binance_spot_pro
          rm -f test/widget_test.dart
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Enable core library desugaring
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - << 'PY'
          import os, re
          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"
          path = kts if os.path.exists(kts) else groovy
          is_kts = path == kts
          src = open(path).read()

          flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
          if "oreLibraryDesugaringEnabled" not in src:
              src, n = re.subn(r"(compileOptions\s*\{)", r"\1\n        " + flag, src, count=1)
              if n == 0:
                  raise SystemExit("compileOptions block not found in " + path)

          dep = (
              '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              if is_kts else
              "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          )
          if "desugar_jdk_libs" not in src:
              src += dep

          open(path, "w").write(src)
          print("Patched", path)
          PY

      - name: Install packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate Drift / code-gen files
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: flutter test

      - name: Build APK (release)
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Build AAB (release)
        if: ${{ github.event.inputs.build_aab == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: binance-spot-pro-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: ${{ github.event.inputs.build_aab == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: binance-spot-pro-aab
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
